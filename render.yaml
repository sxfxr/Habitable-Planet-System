services:
  - type: web
    name: celestial-voyager
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --prefix Backend && npm test --prefix Backend
    startCommand: npm run deploy:start --prefix Backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEARCHER_SIGNUP_KEY
        generateValue: true
